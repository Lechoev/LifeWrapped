version: '3.8'

services:
  web:
    build: .
    container_name: life_wrapped_web
    command: /app/scripts/start.sh
    restart: always
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env.render
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/src

  db:
    image: postgres:16-alpine
    container_name: db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env.render
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  celery_worker:
    build: .
    container_name: celery_worker
    command: >
      celery -A src.conf.celery.celery_app worker 
      --loglevel=info 
      --concurrency=4 
      --max-tasks-per-child=1000 
      --prefetch-multiplier=1
    env_file:
      - .env.render
    depends_on:
      - db
      - redis
    environment:
      - PYTHONPATH=/app/src
    restart: unless-stopped

  flower:
    build: .
    container_name: flower
    command: >
      celery -A src.conf.celery.celery_app flower 
      --port=5555 
      --broker=redis://redis:6379/0 
      --basic_auth=admin:admin
    env_file:
      - .env.render
    depends_on:
      - redis
      - celery_worker
    ports:
      - "5555:5555"
    environment:
      - PYTHONPATH=/app/src
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
