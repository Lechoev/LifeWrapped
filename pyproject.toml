[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"


[tool.ruff]
line-length = 88
target-version = "py312"


[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/conf/__init__.py" = ["F401"]
"alembic/env.py" = ["E402"]
"alembic/**/*.py" = ["E501", "I001", "F401", "W291"]
