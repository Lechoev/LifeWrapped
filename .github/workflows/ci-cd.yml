name: CI/CD for LifeWrapped

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db

          REDIS_URL: redis://localhost:6379/0

          SECRET_KEY: ci_test_secret_key_only_for_github_actions_2026
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          REFRESH_TOKEN_EXPIRE_DAYS: 7

          DEBUG: "True"

          EMAIL_HOST: smtp.test-server.com
          EMAIL_PORT: 587
          EMAIL_USE_TLS: "True"
          EMAIL_USE_SSL: "False"
          EMAIL_HOST_USER: test-user@example.com
          EMAIL_HOST_PASSWORD: test-password-123
          DEFAULT_FROM_EMAIL: noreply@example.com

          LOG_LEVEL: DEBUG
          LOG_FILE: test_app.log

        run: |
          pytest -v --cov=src --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  deploy:
    needs: [ test, lint ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: SSH на сервер и обновление
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /home/deploy/LifeWrapped/LifeWrapped
            git pull origin master
            docker-compose down
            docker-compose up -d --build
            echo "Новая версия запущена!"
